<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>單純貝氏與最近鄰居｜四格漫畫</title><style>html,body{margin:0;width:100%;height:100%;background:white;font-family:"Microsoft JhengHei",sans-serif}img{display:block;width:100vw;height:100vh;object-fit:contain}nav{position:fixed;left:10px;bottom:10px;background:#fffffff2;padding:8px;border-radius:8px;opacity:0;transition:opacity .15s}nav:hover,nav:focus-within{opacity:1}button,select{font-size:16px;padding:6px}#hint{position:fixed;right:0;top:0;font-size:11px;background:#fff9;opacity:0}body:hover #hint{opacity:1}</style><img id="comic" alt=""><nav><button id="prev">上一張</button><select id="pick" aria-label="選擇漫畫"><option value="01">01 高維機率表，塞爆了！</option><option value="02">02 對數：小數連乘變連加</option><option value="03">03 先知道類別，再假設獨立</option><option value="04">04 沒出現的字，也有一票</option><option value="05">05 先驗加權，才是分類分數</option><option value="06">06 分數大，不等於機率大於一</option><option value="07">07 二元線索，加權成直線</option><option value="08">08 先找最近，再來投票</option><option value="09">09 誤差保證，要看前提</option><option value="10">10 奇數鄰居，也可能平手</option><option value="11">11 最近鄰，把空間分地盤</option><option value="12">12 鄰居多，未必分得好</option><option value="13">13 三種分類器，各有代價</option><option value="14">14 沒有訓練，查詢仍要忙</option></select><button id="next">下一張</button></nav><div id="hint">左右方向鍵切換｜游標移至左下角可選圖</div><script>const items=[{"id":"01","title":"高維機率表，塞爆了！"},{"id":"02","title":"對數：小數連乘變連加"},{"id":"03","title":"先知道類別，再假設獨立"},{"id":"04","title":"沒出現的字，也有一票"},{"id":"05","title":"先驗加權，才是分類分數"},{"id":"06","title":"分數大，不等於機率大於一"},{"id":"07","title":"二元線索，加權成直線"},{"id":"08","title":"先找最近，再來投票"},{"id":"09","title":"誤差保證，要看前提"},{"id":"10","title":"奇數鄰居，也可能平手"},{"id":"11","title":"最近鄰，把空間分地盤"},{"id":"12","title":"鄰居多，未必分得好"},{"id":"13","title":"三種分類器，各有代價"},{"id":"14","title":"沒有訓練，查詢仍要忙"}];let idx=Math.max(0,items.findIndex(i=>i.id===new URLSearchParams(location.search).get('id')));function show(){let x=items[idx];document.getElementById('comic').src=x.id+'.jpg';document.getElementById('comic').alt=x.title;document.getElementById('pick').value=x.id;document.title=x.id+' '+x.title;history.replaceState(null,'','?id='+x.id)}document.getElementById('prev').onclick=()=>{idx=(idx+items.length-1)%items.length;show()};document.getElementById('next').onclick=()=>{idx=(idx+1)%items.length;show()};document.getElementById('pick').onchange=e=>{idx=items.findIndex(i=>i.id===e.target.value);show()};onkeydown=e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()};show();</script></html>
