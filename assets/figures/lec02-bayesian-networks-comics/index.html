<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>貝氏網路｜四格漫畫</title><style>html,body{margin:0;width:100%;height:100%;background:white;font-family:"Microsoft JhengHei",sans-serif}img{display:block;width:100vw;height:100vh;object-fit:contain}nav{position:fixed;left:10px;bottom:10px;background:#fffffff2;padding:8px;border-radius:8px;opacity:0}nav:hover,nav:focus-within{opacity:1}button,select{font-size:16px;padding:6px}</style><img id="comic" alt=""><nav><button id="prev">上一張</button><select id="pick" aria-label="選擇漫畫"><option value="01">01 機率表太大，關係也不能全刪</option><option value="02">02 拆成連乘，不代表省參數</option><option value="03">03 真正省下來的是父集合</option><option value="04">04 箭頭有方向，沿路不能繞回</option><option value="05">05 有圖，還得有機率表</option><option value="06">06 全部取一，六個因子相乘</option><option value="07">07 知道中介，資訊就不同</option><option value="08">08 數參數，要先數父節點</option><option value="09">09 同樣六變數，六、十四、六十三</option><option value="10">10 從吸菸、疾病，連到檢測</option><option value="11">11 看清楚，誰是已知條件</option><option value="12">12 完全獨立，和單純貝氏差在哪</option></select><button id="next">下一張</button></nav><script>const items=[{"id":"01","title":"機率表太大，關係也不能全刪"},{"id":"02","title":"拆成連乘，不代表省參數"},{"id":"03","title":"真正省下來的是父集合"},{"id":"04","title":"箭頭有方向，沿路不能繞回"},{"id":"05","title":"有圖，還得有機率表"},{"id":"06","title":"全部取一，六個因子相乘"},{"id":"07","title":"知道中介，資訊就不同"},{"id":"08","title":"數參數，要先數父節點"},{"id":"09","title":"同樣六變數，六、十四、六十三"},{"id":"10","title":"從吸菸、疾病，連到檢測"},{"id":"11","title":"看清楚，誰是已知條件"},{"id":"12","title":"完全獨立，和單純貝氏差在哪"}];let idx=Math.max(0,items.findIndex(i=>i.id===new URLSearchParams(location.search).get('id')));function show(){let x=items[idx];document.getElementById('comic').src=x.id+'.jpg';document.getElementById('comic').alt=x.title;document.getElementById('pick').value=x.id;document.title=x.id+' '+x.title;history.replaceState(null,'','?id='+x.id)}document.getElementById('prev').onclick=()=>{idx=(idx+items.length-1)%items.length;show()};document.getElementById('next').onclick=()=>{idx=(idx+1)%items.length;show()};document.getElementById('pick').onchange=e=>{idx=items.findIndex(i=>i.id===e.target.value);show()};onkeydown=e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()};show();</script></html>
